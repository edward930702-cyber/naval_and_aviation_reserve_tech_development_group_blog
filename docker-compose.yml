services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"  # 若只需容器內連線可將此行移除，僅留內網連線

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"  # 限制僅限 Ubuntu 本機 (Loopback) 存取
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/article_library:/app/article_library

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "4321:4321"  # Astro 前端預設 4321 埠
    depends_on:
      - backend